name: GitHub Actions CI workflow

on:
  push:
    branches: [master, feature/fastapi-mysql]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write # 讓 AI 有權限在 PR 下面留言

jobs:
  # ----------------------------------------------------
  # 1. 測試 Job（整合 AI 失敗診斷）    ##
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 執行測試並匯出 log（使用 pipefail 確保 pytest 失敗時會正確觸發 Exit Code 1）
      - name: Run Pytest
        id: run_tests
        shell: bash
        run: |
          set -o pipefail
          pytest --cov=. --cov-report=term-missing --cov-fail-under=80 | tee pytest.log

      # 🤖 AI 失敗診斷：只有測試失敗時才會觸發！
      - name: AI Diagnosis on Failure
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          import os, requests

          api_key = os.environ.get('OPENAI_API_KEY')
          if not api_key:
              print('缺少 OPENAI_API_KEY,無法進行 AI 診斷。')
              exit(0)

          try:
              with open('pytest.log', 'r') as f:
                  log_content = f.read()
          except Exception as e:
              log_content = f'Cannot read log file: {e}'
               
          prompt = f"Please analyze the following pytest test failure log in English. Provide a concise root-cause diagnosis and step-by-step fix recommendations:\n\n{log_content}"  
          
          headers = {
              'Authorization': f'Bearer {api_key}',
              'Content-Type': 'application/json'
          }

          data = {
              'model': 'gpt-4o-mini',
              'messages': [{'role': 'user', 'content': prompt}]
          }

          try:
              res = requests.post('https://api.openai.com/v1/chat/completions', json=data, headers=headers, timeout=30)
              if res.status_code == 200:
                  analysis = res.json()['choices'][0]['message']['content']
                  print('\n----------------------------------------')
                  print('           🤖 AI 錯誤診斷報告           ')
                  print('----------------------------------------\n')
                  print(analysis)
              else:
                  print(f'AI Analysis Failed: {res.status_code} - {res.text}')
          except Exception as e:
              print(f'AI Request Exception: {e}')
          "

  # ----------------------------------------------------
  # 2. 🤖 Pull Request AI Code Review
  # ----------------------------------------------------
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit AI PR Review
        uses: coderabbitai/coderabbit-action@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

